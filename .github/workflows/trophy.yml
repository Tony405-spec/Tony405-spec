name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Tony405-spec
          file: profile-trophy.svg
          theme: onedark
          no-frame: true
          no-background: true
          margin-width: 4
          token: ${{ secrets.TROPHY_TOKEN }}

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-trophy.svg
          git commit -m "Update trophy SVG" || echo "No changes"
          git push
