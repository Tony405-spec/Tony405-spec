name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ryo-ma/github-profile-trophy@main
        with:
          username: Tony405-spec
          output: profile-trophy.svg
          theme: onedark
          no-frame: true
          no-bg: true
          margin-w: 4

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-trophy.svg
          git commit -m "Update trophy SVG" || echo "No changes"
          git push
